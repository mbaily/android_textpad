[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textpad-sync"
version = "0.1.2"
description = "Terminal client for syncing Textpad server documents with local files"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.scripts]
textpad-sync = "textpad_sync.cli:main"

[tool.setuptools.packages.find]
include = ["textpad_sync*"]
