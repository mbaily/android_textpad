# Included inside the existing HTTPS VirtualHost. The backend is loopback-only.
ProxyPass "/android_textpad/api/v1/events" "http://127.0.0.1:8768/api/v1/events" upgrade=websocket retry=0 timeout=75
ProxyPassReverse "/android_textpad/api/v1/events" "http://127.0.0.1:8768/api/v1/events"
ProxyPass "/android_textpad/editor/api/events" "http://127.0.0.1:8768/editor/api/events" upgrade=websocket retry=0 timeout=75
ProxyPassReverse "/android_textpad/editor/api/events" "http://127.0.0.1:8768/editor/api/events"
ProxyPass "/android_textpad/api/" "http://127.0.0.1:8768/api/" retry=0 timeout=120
ProxyPassReverse "/android_textpad/api/" "http://127.0.0.1:8768/api/"
ProxyPass "/android_textpad/editor" "http://127.0.0.1:8768/editor" retry=0 timeout=120
ProxyPassReverse "/android_textpad/editor" "http://127.0.0.1:8768/editor"
