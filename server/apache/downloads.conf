# Included inside the existing HTTPS VirtualHost for git23069.hopto.org.
Alias "/android_textpad" "/opt/android_textpad/deployment"

<Directory "/opt/android_textpad/deployment">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
    AddType application/vnd.android.package-archive .apk

    Header always set Cache-Control "no-cache"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

    <FilesMatch "\.apk$">
        Header set Content-Disposition "attachment"
    </FilesMatch>
</Directory>
